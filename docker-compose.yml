services:
  redis:
    container_name: redis
    image: redis:7.4-alpine
    restart: always
    ports:
      - "6379:6379"
    command: redis-server --save 60 1 --loglevel warning

  backend:
    build: .
    container_name: backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app  # کل پروژه را mount می‌کند نه فقط core
    ports:
      - "8000:8000"
    environment:
      - SECRET_KEY=test
      - DEBUG=True
      - DJANGO_SETTINGS_MODULE=core.settings.deployment  # استفاده از deployment برای توسعه
      - PYTHONPATH=/app
    depends_on:
      - redis
  
  worker:
    build: .
    command: celery -A core worker --loglevel=info
    volumes:
      - .:/app  # کل پروژه را mount می‌کند
    environment:
      - DJANGO_SETTINGS_MODULE=core.settings.deployment
      - PYTHONPATH=/app
    depends_on:
      - redis
      - backend

  smtp4dev:
    image: rnwood/smtp4dev
    restart: always
    ports:
      - '5000:80'  # Web interface
      - '25:25'    # SMTP server
      - '143:143'  # IMAP server
    volumes:
      - smtp4dev-data:/smtp4dev
    environment:
      - ServerOptions__HostName=smtp4dev

volumes:
  smtp4dev-data: